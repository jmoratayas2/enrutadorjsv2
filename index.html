<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sitio SPA desarrollado con HTML, CSS y JavaScript puro usando un Router basado en hash.">
  <title>Inicio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#/inicio" data-route="/inicio">Inicio</a>
        <a href="#/nosotros" data-route="/nosotros">Nosotros</a>
        <a href="#/servicios" data-route="/servicios">Servicios</a>
        <a href="#/contacto" data-route="/contacto">Contacto</a>
      </nav>
    </header>

    <main id="app" class="view-panel" aria-live="polite" aria-busy="true">
      <p class="loading-message">Cargando contenido...</p>
    </main>

    <footer class="site-footer">
      <p>Universidad Mariano Gálvez de Guatemala.</p>
    </footer>
  </div>

  <script src="js/router.js"></script>
</body>
</html>
